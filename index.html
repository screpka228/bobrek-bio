<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090911"><title>bobrek</title><link rel="stylesheet" href="style.css"></head>
<body><div class="bg" id="bg"></div><div class="scanlines"></div><div class="glitch-line"></div><div id="snow-layer" class="snow-layer" aria-hidden="true"></div><div id="cursor-dot" class="cursor-dot" aria-hidden="true"></div>
<main><section class="card">
<img class="avatar" id="avatar" alt="avatar"><h1 id="name">bobrek</h1><p id="tag">join temm bobrek tofday</p><div class="location" id="location">⌖ Russia</div>
<div class="presence" id="presence"><div class="presence-avatar-wrap"><img id="davatar" alt="Discord avatar"><i id="state" aria-label="Discord status"></i></div><div class="presence-text"><div class="presence-heading"><b id="dname">bobrek</b><span class="profile-pill" id="profile-pill"><span id="profile-pill-emoji">💗</span><span id="profile-pill-text">meow</span></span><span class="profile-badge" aria-label="Profile badge">✦</span></div><span id="activity">Discord presence not configured</span><small id="detail">add User ID in config.js</small></div></div>
<nav id="socials" class="socials" aria-label="Social links"></nav>
<div class="music"><button id="play" aria-label="Play music">▶</button><div class="track"><b id="track">music</b><small id="musicState">click to play</small></div><div class="eq"><i></i><i></i><i></i><i></i><i></i></div><audio id="audio" loop></audio></div>
<footer><span>✳ bobrek</span><div class="visitor-count" aria-label="Счётчик посещений"><span class="visitor-dot" aria-hidden="true"></span><span>visitors</span><b id="visitor-total">…</b></div><span id="clock">00:00</span></footer></section><div class="signature">NO ONE KNOWS YOU HERE</div></main>
<script data-goatcounter="https://screpka228.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script><script src="config.js"></script><script src="script.js"></script><script>fetch("https://screpka228.goatcounter.com/counter/TOTAL.json").then(r=>{if(!r.ok)throw new Error("counter unavailable");return r.json()}).then(d=>{document.getElementById("visitor-total").textContent=d.count??"—"}).catch(()=>{document.getElementById("visitor-total").textContent="—"})</script></body></html>
